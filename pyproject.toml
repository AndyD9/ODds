[project]
name = "odds"
version = "0.1.0"
description = "Sports probability engine — étape 1 : test de viabilité"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "requests>=2.32",
    "matplotlib>=3.9",
    "pyarrow>=25.0.1",
    # Épinglé au patch : ~100 lignes de theme.css visent des `data-testid`
    # que Streamlit ne documente pas (décisions/0007). Une montée de mineure
    # se fait à la main, en relisant la zone 1–10 de la feuille.
    "streamlit~=1.64.0",
    "altair>=6.3.0",
    "authlib>=1.3.2",
]

[project.scripts]
odds = "odds.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyterlab>=4.2", "ipykernel>=6.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
